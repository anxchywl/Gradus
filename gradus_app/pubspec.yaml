name: gradus_app
description: >-
  Standalone host for Gradus. Scaffolding for running the feature
  without a host application; it is not what ships.

publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_ui:
    path: ../app_ui
  gradus_feature:
    path: ../gradus_feature

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
