name: gpa_app
description: >-
  Standalone host for the GPA feature. Scaffolding for running the feature
  without the superapp; it is not what ships.

publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_ui:
    path: ../app_ui
  gpa_feature:
    path: ../gpa_feature

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
