name: CI

# pull requests only validate. actions are pinned to commit SHAs and every
# downloaded tool is checksum-verified; tests/unit/test_ci_policy.py enforces
# both, so this file cannot quietly drift

on:
  push:
    tags-ignore:
      - "v*.*.*"
  pull_request:

# read-only, and no job asks for more; a fork's pull request gets the same
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            flutter:
              - 'app_ui/**'
              - 'gradus_feature/**'
              - 'gradus_app/**'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'

  backend-quality:
    name: Backend format, analyze and test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Check backend formatting
        working-directory: backend
        run: uv run --frozen ruff format --check app evals tests

      - name: Lint backend
        working-directory: backend
        run: uv run --frozen ruff check app evals tests

      - name: Type-check backend
        working-directory: backend
        run: uv run --frozen mypy app

      - name: Scan backend source
        working-directory: backend
        run: uv run --frozen bandit -q -r app

      - name: Test backend
        working-directory: backend
        run: uv run --frozen pytest --cov=app --cov-report=term-missing --cov-fail-under=90 -q

  flutter-quality:
    name: Flutter format, analyze and test
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: |
          for package in app_ui gradus_feature gradus_app; do
            (cd "$package" && flutter pub get)
          done

      - name: Generate feature localizations
        working-directory: gradus_feature
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          for package in app_ui gradus_feature gradus_app; do
            (cd "$package" && dart format --output=none --set-exit-if-changed lib test)
          done

      - name: Analyze
        run: |
          for package in app_ui gradus_feature gradus_app; do
            (cd "$package" && flutter analyze --no-pub --fatal-infos)
          done

      - name: Test
        run: |
          (cd app_ui && flutter test --no-pub)
          (cd gradus_app && flutter test --no-pub)
          (cd gradus_feature && flutter test --no-pub --coverage)

      - name: Enforce coverage floor
        run: ./scripts/coverage_floor.sh gradus_feature/coverage/lcov.info 85

  android-build:
    name: Android debug build
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate feature localizations
        working-directory: gradus_feature
        run: |
          flutter pub get
          flutter gen-l10n

      # no credential define and no development-access flag: a build that leaves
      # this runner must not be able to open the feature by itself
      - name: Build debug artifact
        working-directory: gradus_app
        run: flutter build apk --debug

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # full history, so a secret committed earlier is still found
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive=$(mktemp)
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Install osv-scanner
        env:
          VERSION: "2.5.0"
          SHA256: "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c"
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "$SHA256  /usr/local/bin/osv-scanner" | sha256sum --check
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan committed lockfiles
        run: |
          osv-scanner scan source --lockfile=backend/uv.lock
          osv-scanner scan source --lockfile=gradus_app/pubspec.lock
