# local development: the service itself, since it depends on nothing else.
# run it from the host with uvicorn instead when iterating on the code
name: gradus

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_ADAPTER: ${AUTH_ADAPTER:-development}
      DEVELOPMENT_AUTH_TOKEN: ${DEVELOPMENT_AUTH_TOKEN:-}
      DEVELOPMENT_OPERATOR_AUTH_TOKEN: ${DEVELOPMENT_OPERATOR_AUTH_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - "127.0.0.1:8000:8000"
