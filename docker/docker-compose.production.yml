name: gradus

services:
  backend:
    image: ${BACKEND_IMAGE:-gradus-backend:local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      AUTH_ADAPTER: ${AUTH_ADAPTER:?AUTH_ADAPTER is required}
      HOST_JWT_ISSUER: ${HOST_JWT_ISSUER:-}
      HOST_JWT_AUDIENCE: ${HOST_JWT_AUDIENCE:-}
      HOST_JWT_ALGORITHM: ${HOST_JWT_ALGORITHM:-RS256}
      HOST_JWT_PUBLIC_KEY: ${HOST_JWT_PUBLIC_KEY:-}
      HOST_JWT_SECRET: ${HOST_JWT_SECRET:-}
      HOST_SUBJECT_CLAIM: ${HOST_SUBJECT_CLAIM:-sub}
      HOST_OPERATOR_CLAIM: ${HOST_OPERATOR_CLAIM:-}
      HOST_OPERATOR_VALUE: ${HOST_OPERATOR_VALUE:-}
      SYLLABUS_API_KEY: ${SYLLABUS_API_KEY:-}
      SYLLABUS_PROVIDER: ${SYLLABUS_PROVIDER:-anthropic}
      SYLLABUS_BASE_URL: ${SYLLABUS_BASE_URL:-}
      SYLLABUS_MODEL: ${SYLLABUS_MODEL:-claude-haiku-4-5}
      SYLLABUS_TIMEOUT_SECONDS: ${SYLLABUS_TIMEOUT_SECONDS:-45}
      SYLLABUS_OUTPUT_TOKENS: ${SYLLABUS_OUTPUT_TOKENS:-4000}
      SYLLABUS_DOCUMENT_MAX_BYTES: ${SYLLABUS_DOCUMENT_MAX_BYTES:-4194304}
      SYLLABUS_DOCUMENT_MAX_PAGES: ${SYLLABUS_DOCUMENT_MAX_PAGES:-60}
      SYLLABUS_DOCUMENT_MAX_CHARACTERS: ${SYLLABUS_DOCUMENT_MAX_CHARACTERS:-120000}
      SYLLABUS_RATE_LIMIT: ${SYLLABUS_RATE_LIMIT:-20}
      SYLLABUS_RATE_WINDOW_SECONDS: ${SYLLABUS_RATE_WINDOW_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-150000}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-20}
      MAXIMUM_PAGE_SIZE: ${MAXIMUM_PAGE_SIZE:-50}
    command:
      - .venv/bin/uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.16.0.0/12
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
    # the host runs several projects on 3.7 GiB with no swap, so an unbounded
    # container here would be taken out of somebody else's budget
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

networks:
  edge:
